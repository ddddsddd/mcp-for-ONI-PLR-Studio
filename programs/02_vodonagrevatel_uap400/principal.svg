  <text x="616" y="768" font-size="13">силовая цепь</text>
  <text x="26" y="790" font-size="13">KM</text>
  <text x="146" y="790" font-size="13">Контактор электромагнитный, катушка ~220 В</text>
  <text x="566" y="790" font-size="13">1</text>
  <text x="616" y="790" font-size="13">включает ТЭНы</text>
