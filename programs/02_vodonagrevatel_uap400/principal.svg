  <text x="566" y="812" font-size="13">6</text>
  <text x="616" y="812" font-size="13">по 2 на фазу, звезда</text>
  <text x="26" y="834" font-size="13">SF</text>
  <text x="146" y="834" font-size="13">Выключатель автоматический однополюсный</text>
  <text x="566" y="834" font-size="13">1</text>
  <text x="616" y="834" font-size="13">цепь управления</text>
  <text x="26" y="856" font-size="13">SK</text>
  <text x="146" y="856" font-size="13">Датчик-реле температуры (термоконтакт)</text>
  <text x="566" y="856" font-size="13">1</text>
  <text x="616" y="856" font-size="13">размыкается при нагреве</text>
  <text x="26" y="878" font-size="13">R</text>
  <text x="146" y="878" font-size="13">Резистор добавочный</text>
  <text x="566" y="878" font-size="13">1</text>
  <text x="616" y="878" font-size="13">для лампы HG</text>
  <text x="26" y="900" font-size="13">HG</text>
  <text x="146" y="900" font-size="13">Лампа сигнальная «Нагрев»</text>
  <text x="566" y="900" font-size="13">1</text>
  <text x="616" y="900" font-size="13"></text>
  <text x="26" y="922" font-size="13">A1</text>
  <text x="146" y="922" font-size="13">Программируемое реле ONI PLR-S-CPU-1410</text>
  <text x="566" y="922" font-size="13">1</text>
  <text x="616" y="922" font-size="13">вместо реле KV</text>
  <text x="20" y="958" font-size="13">Реле KV исходной схемы (рис. 18.1, б) заменено реле A1: термоконтакт SK подан на вход I1, выход Q1 включает катушку KM</text>
  <text x="20" y="976" font-size="13">и параллельно лампу HG через резистор R. Вода холодная — SK замкнут — ТЭНы включены; вода нагрета — SK разомкнут — ТЭНы отключены.</text>
